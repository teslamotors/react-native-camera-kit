name: Build
run-name: ⚙️ Build examples on ${{ github.event_name == 'pull_request' && 'PR' || '🌱' }} ${{ github.event_name == 'pull_request' && github.event.number || github.ref_name }}

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-example-ios:
    name: build-example-ios
    runs-on: macos-15
    env:
      # Keep the iOS 26 SDK required by Camera Kit while avoiding the fmt
      # compilation failure with the runner's newer default Xcode.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7.4'
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Install example
        run: yarn bootstrap
      - name: Build
        run: cd example/ios && xcodebuild -workspace CameraKitExample.xcworkspace -configuration Debug -scheme CameraKitExample -sdk iphoneos build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
  build-example-android:
    name: build-example-android (new architecture ${{ matrix.new-architecture }})
    runs-on: ubuntu-latest # using linux runner for speed
    strategy:
      fail-fast: false
      matrix:
        new-architecture: ['false', 'true']
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Install example
        # The example's postinstall runs CocoaPods, which requires macOS.
        run: yarn --cwd example install --frozen-lockfile --ignore-scripts
      - name: Run native unit tests
        working-directory: example/android
        run: ./gradlew :react-native-camera-kit:testDebugUnitTest -PnewArchEnabled=${{ matrix.new-architecture }} --console=plain
      - name: Build
        working-directory: example/android
        run: ./gradlew assembleDebug -PnewArchEnabled=${{ matrix.new-architecture }} --console=plain
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-unit-tests-${{ matrix.new-architecture }}
          path: android/build/test-results/testDebugUnitTest
